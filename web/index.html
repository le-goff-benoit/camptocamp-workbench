  <div id="shell">
    <aside id="sidebar" aria-label="Navigation et projets">
      <a class="brand" href="/workbench/" data-nav="dashboard"><img src="/workbench/static/brand/camptocamp-logo.png" alt="Camptocamp"></a>
      <nav class="primary-nav" aria-label="Navigation principale">
        <button data-nav="dashboard" class="nav-item active"><svg class="i"><use href="#i-home"/></svg><span>Aujourd’hui</span></button>
        <button data-nav="emails" class="nav-item"><svg class="i"><use href="#i-mail"/></svg><span>Emails récents</span></button>
        <button data-nav="agenda" class="nav-item"><svg class="i"><use href="#i-calendar"/></svg><span>Agenda</span></button>
      </nav>
      <div class="projects-heading"><button data-nav="projects" class="plain projects-link">Projets <span id="projects-total"></span></button></div>
      <label class="project-search-wrap"><svg class="i"><use href="#i-search"/></svg><input id="project-search" type="search" aria-label="Rechercher un projet" placeholder="Filtrer les projets" autocomplete="off"><kbd title="Appuyez sur / pour filtrer">/</kbd></label>
      <div id="project-shortcuts" aria-label="Projets"></div>
      <nav class="secondary-nav" aria-label="Outils">
        <button data-nav="library" class="nav-item"><svg class="i"><use href="#i-book"/></svg><span>Bibliothèque</span></button>
        <button data-nav="connections" class="nav-item"><svg class="i"><use href="#i-plug"/></svg><span>Connexions</span></button>
        <button data-nav="settings" class="nav-item"><svg class="i"><use href="#i-settings"/></svg><span>Paramètres</span></button>
      </nav>
    </aside>
    <div id="sidebar-scrim" hidden></div>
    <div id="workspace">
      <header class="workspace-header">
        <button id="sidebar-toggle" class="icon-button" aria-label="Afficher la navigation"><svg class="i"><use href="#i-menu"/></svg></button>
        <nav id="breadcrumb" aria-label="Fil d’Ariane">Aujourd’hui</nav>
        <button id="palette-open" class="palette-trigger" aria-label="Rechercher ou lancer une action (Ctrl K)"><svg class="i"><use href="#i-search"/></svg><span>Rechercher, ouvrir, lancer…</span><kbd>Ctrl K</kbd></button>
        <div class="header-actions">
          <span id="activity-indicator" hidden></span>
          <button id="terminal-toggle" class="ghost" aria-label="Terminal" aria-pressed="false"><svg class="i"><use href="#i-terminal"/></svg><span class="label">Terminal</span><span id="terminal-count" class="count">0</span></button>
        </div>
      </header>
      <main id="content" tabindex="-1"><div class="empty"><h1>Ouverture de votre espace…</h1></div></main>
      <section id="terminal-panel" hidden aria-label="Terminal du projet">
        <div id="terminal-resizer" role="separator" aria-label="Hauteur du terminal" aria-orientation="horizontal" tabindex="0"></div>
        <div id="terminal-toolbar">
          <strong id="terminal-scope">Terminal</strong>
          <div id="terminal-tabs" role="tablist"></div>
          <button id="terminal-new" class="term-icon" aria-label="Nouveau terminal" title="Nouveau terminal"><svg class="i"><use href="#i-plus"/></svg></button>
          <button id="terminal-max" class="term-icon" aria-label="Agrandir le terminal" title="Agrandir"><svg class="i"><use href="#i-maximize"/></svg></button>
          <button id="terminal-hide" class="term-icon" aria-label="Réduire le terminal" title="Réduire (Ctrl+`)"><svg class="i"><use href="#i-chevron-down"/></svg></button>
        </div>
        <div id="terminal-views"></div>
      </section>
    </div>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><form id="modal-form"><div id="modal-body"></div><p id="modal-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" id="modal-cancel" class="secondary">Annuler</button><button type="submit" id="modal-submit">Enregistrer</button></div></form></dialog>
  <dialog id="palette" aria-label="Rechercher ou lancer une action"><div class="palette-input"><svg class="i"><use href="#i-search"/></svg><input id="palette-input" type="text" placeholder="Projet, page ou action…" aria-label="Rechercher une commande" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="palette-list"></div><div id="palette-list" role="listbox"></div><div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> naviguer</span><span><kbd>Entrée</kbd> ouvrir</span><span><kbd>Échap</kbd> fermer</span></div></dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
